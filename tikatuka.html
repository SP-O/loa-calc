<script>
(function () {
    var f = document.getElementById('toolFrame');
    var light = document.body.classList.contains('light-mode');
    f.src = '/tools/tikatuka?theme=' + (light ? 'light' : 'dark');

    // 도구가 보고하는 콘텐츠 높이에 맞춰 iframe을 늘린다(내부 스크롤 방지)
    window.addEventListener('message', function (e) {
        if (e.source !== f.contentWindow) return;
        var d = e.data;
        if (d && d.type === 'tipago-height' && typeof d.height === 'number') {
            f.style.height = Math.max(420, d.height + 4) + 'px';
        }
    });

    var btn = document.getElementById('theme-toggle');
    if (btn) btn.addEventListener('click', function () {
        var mode = document.body.classList.contains('light-mode') ? 'light' : 'dark';
        try { f.contentWindow.postMessage({ type: 'theme', mode: mode }, '*'); } catch (err) {}
    });
})();
</script>
